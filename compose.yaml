  milestone6-takeover-verify:
    profiles: ["acceptance"]
    image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    restart: "no"
    environment:
      MYSQL_PWD: ${FLOWDESK_MYSQL_ROOT_PASSWORD:?set FLOWDESK_MYSQL_ROOT_PASSWORD}
    command:
      - sh
      - -ec
      - >-
        test "$(mysql --protocol=tcp -hmysql -uroot -N -B
        -e 'SELECT marker FROM flowdesk_workflow_m6_takeover.milestone6_takeover_result')"
        = FLOWDESK_MILESTONE_6_HISTORICAL_TAKEOVER_OK &&
        echo FLOWDESK_MILESTONE_6_HISTORICAL_TAKEOVER_OK
    depends_on:
      milestone6-takeover-migrate:
        condition: service_completed_successfully
    networks:
      - data

