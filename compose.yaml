        condition: service_completed_successfully
    networks:
      - data

  # M10 deployable application profile. Historical milestone scripts keep
  # using host JVMs; this profile is the reproducible single-machine topology
  # used by the final acceptance gate.
  m10-monitoring-credentials:
    profiles: ["acceptance"]
    image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    restart: "no"
    environment:
      MYSQL_PWD: ${FLOWDESK_MYSQL_ROOT_PASSWORD:?set FLOWDESK_MYSQL_ROOT_PASSWORD}
    command: ["sh", "-ec", "mysql --protocol=tcp -hmysql -uroot < /runtime/monitoring-credentials.sql"]
    depends_on:
      seed-alert: {condition: service_completed_successfully}
    volumes:
      - type: bind
        source: ${FLOWDESK_M10_RUNTIME_DIRECTORY:-./.data/milestone10}
        target: /runtime
        read_only: true
    networks: [data]

  iam:
    profiles: ["m10"]
    build:
      context: .
      dockerfile: Dockerfile
      args: {SERVICE: flowdesk-iam-service}
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      <<: *nacos-client-environment
      FLOWDESK_IAM_PORT: 8081
      FLOWDESK_IAM_DB_PASSWORD: ${FLOWDESK_IAM_DB_PASSWORD:?set FLOWDESK_IAM_DB_PASSWORD}
      FLOWDESK_CURSOR_TOKEN_HMAC_KEY: ${FLOWDESK_CURSOR_TOKEN_HMAC_KEY:?set FLOWDESK_CURSOR_TOKEN_HMAC_KEY}
      FLOWDESK_IAM_JWT_PRIVATE_KEY_FILE: /run/secrets/flowdesk-jwt-private.pem
      FLOWDESK_IAM_SERVICE_JWT_OUTPUT_DIRECTORY: /run/flowdesk/service-tokens
      FLOWDESK_IAM_SERVICE_JWT_MAPPINGS: ${FLOWDESK_IAM_SERVICE_JWT_MAPPINGS:?set FLOWDESK_IAM_SERVICE_JWT_MAPPINGS}
    secrets:
      - source: flowdesk-jwt-private
        target: flowdesk-jwt-private.pem
    volumes:
      - flowdesk-service-tokens:/run/flowdesk/service-tokens
    depends_on:
      seed-iam: {condition: service_completed_successfully}
      nacos-config-initialize: {condition: service_completed_successfully}
    networks: [data, control]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Correlation-Id: 00000000-0000-4000-8000-000000000000' http://127.0.0.1:8081/api/v1/internal/health/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  workflow:
    profiles: ["m10"]
    build:
      context: .
      dockerfile: Dockerfile
      args: {SERVICE: flowdesk-workflow-service}
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      <<: *nacos-client-environment
      FLOWDESK_WORKFLOW_PORT: 8083
      FLOWDESK_WORKFLOW_DB_PASSWORD: ${FLOWDESK_WORKFLOW_DB_PASSWORD:?set FLOWDESK_WORKFLOW_DB_PASSWORD}
      FLOWDESK_CURSOR_TOKEN_HMAC_KEY: ${FLOWDESK_CURSOR_TOKEN_HMAC_KEY:?set FLOWDESK_CURSOR_TOKEN_HMAC_KEY}
      FLOWDESK_JWT_PUBLIC_KEY_FILE: /run/secrets/flowdesk-jwt-public.pem
      FLOWDESK_WORKFLOW_ROCKETMQ_ACCESS_KEY: ${FLOWDESK_WORKFLOW_ROCKETMQ_ACCESS_KEY:?set FLOWDESK_WORKFLOW_ROCKETMQ_ACCESS_KEY}
      FLOWDESK_WORKFLOW_ROCKETMQ_SECRET_KEY: ${FLOWDESK_WORKFLOW_ROCKETMQ_SECRET_KEY:?set FLOWDESK_WORKFLOW_ROCKETMQ_SECRET_KEY}
      FLOWDESK_WORKFLOW_IAM_SERVICE_TOKEN_FILE: /run/flowdesk/service-tokens/{tenantId}-flowdesk-workflow-service.jwt
      FLOWDESK_ROCKETMQ_M8_ENABLED: "true"
    secrets:
      - source: flowdesk-jwt-public
        target: flowdesk-jwt-public.pem
    volumes:
      - flowdesk-service-tokens:/run/flowdesk/service-tokens:ro
    depends_on:
      seed-workflow: {condition: service_completed_successfully}
      iam: {condition: service_healthy}
      rocketmq-broker: {condition: service_healthy}
      rocketmq-topology-provision: {condition: service_completed_successfully}
      nacos-config-initialize: {condition: service_completed_successfully}
    networks: [data, control, messaging]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Correlation-Id: 00000000-0000-4000-8000-000000000000' http://127.0.0.1:8083/api/v1/internal/health/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  ticket:
    profiles: ["m10"]
    build:
      context: .
      dockerfile: Dockerfile
      args: {SERVICE: flowdesk-ticket-service}
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      <<: *nacos-client-environment
      FLOWDESK_TICKET_PORT: 8082
      FLOWDESK_TICKET_DB_PASSWORD: ${FLOWDESK_TICKET_DB_PASSWORD:?set FLOWDESK_TICKET_DB_PASSWORD}
      FLOWDESK_CURSOR_TOKEN_HMAC_KEY: ${FLOWDESK_CURSOR_TOKEN_HMAC_KEY:?set FLOWDESK_CURSOR_TOKEN_HMAC_KEY}
      FLOWDESK_JWT_PUBLIC_KEY_FILE: /run/secrets/flowdesk-jwt-public.pem
      FLOWDESK_REDIS_PASSWORD: ${FLOWDESK_REDIS_PASSWORD:?set FLOWDESK_REDIS_PASSWORD}
      FLOWDESK_TICKET_ROCKETMQ_ACCESS_KEY: ${FLOWDESK_TICKET_ROCKETMQ_ACCESS_KEY:?set FLOWDESK_TICKET_ROCKETMQ_ACCESS_KEY}
      FLOWDESK_TICKET_ROCKETMQ_SECRET_KEY: ${FLOWDESK_TICKET_ROCKETMQ_SECRET_KEY:?set FLOWDESK_TICKET_ROCKETMQ_SECRET_KEY}
      FLOWDESK_TICKET_IAM_SERVICE_TOKEN_FILE: /run/flowdesk/service-tokens/{tenantId}-flowdesk-ticket-service.jwt
      FLOWDESK_ROCKETMQ_M7_ENABLED: "true"
      FLOWDESK_ROCKETMQ_M8_ENABLED: "true"
    secrets:
      - source: flowdesk-jwt-public
        target: flowdesk-jwt-public.pem
    volumes:
      - flowdesk-service-tokens:/run/flowdesk/service-tokens:ro
    depends_on:
      seed-ticket: {condition: service_completed_successfully}
      iam: {condition: service_healthy}
      workflow: {condition: service_healthy}
      redis: {condition: service_healthy}
      rocketmq-broker: {condition: service_healthy}
      rocketmq-topology-provision: {condition: service_completed_successfully}
      nacos-config-initialize: {condition: service_completed_successfully}
    networks: [data, control, messaging]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Correlation-Id: 00000000-0000-4000-8000-000000000000' http://127.0.0.1:8082/api/v1/internal/health/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  alert:
    profiles: ["m10"]
    build:
      context: .
      dockerfile: Dockerfile
      args: {SERVICE: flowdesk-alert-service}
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      <<: *nacos-client-environment
      FLOWDESK_ALERT_PORT: 8084
      FLOWDESK_ALERT_DB_PASSWORD: ${FLOWDESK_ALERT_DB_PASSWORD:?set FLOWDESK_ALERT_DB_PASSWORD}
      FLOWDESK_CURSOR_TOKEN_HMAC_KEY: ${FLOWDESK_CURSOR_TOKEN_HMAC_KEY:?set FLOWDESK_CURSOR_TOKEN_HMAC_KEY}
      FLOWDESK_JWT_PUBLIC_KEY_FILE: /run/secrets/flowdesk-jwt-public.pem
      FLOWDESK_ALERT_ROCKETMQ_ACCESS_KEY: ${FLOWDESK_ALERT_ROCKETMQ_ACCESS_KEY:?set FLOWDESK_ALERT_ROCKETMQ_ACCESS_KEY}
      FLOWDESK_ALERT_ROCKETMQ_SECRET_KEY: ${FLOWDESK_ALERT_ROCKETMQ_SECRET_KEY:?set FLOWDESK_ALERT_ROCKETMQ_SECRET_KEY}
      FLOWDESK_ALERT_WEBHOOK_SECRETS_FILE: /run/secrets/flowdesk-webhook-secrets
      FLOWDESK_ROCKETMQ_M7_ENABLED: "true"
    secrets:
      - source: flowdesk-jwt-public
        target: flowdesk-jwt-public.pem
    volumes:
      - type: bind
        source: ${FLOWDESK_ALERT_WEBHOOK_SECRETS_FILE:-./.data/m10/webhook-secrets.json}
        target: /run/secrets/flowdesk-webhook-secrets
        read_only: true
    depends_on:
      seed-alert: {condition: service_completed_successfully}
      ticket: {condition: service_healthy}
      rocketmq-broker: {condition: service_healthy}
      rocketmq-topology-provision: {condition: service_completed_successfully}
      nacos-config-initialize: {condition: service_completed_successfully}
    networks: [data, control, messaging]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Correlation-Id: 00000000-0000-4000-8000-000000000000' http://127.0.0.1:8084/api/v1/internal/health/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  notification:
    profiles: ["m10"]
    build:
      context: .
      dockerfile: Dockerfile
      args: {SERVICE: flowdesk-notification-service}
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      <<: *nacos-client-environment
      FLOWDESK_NOTIFICATION_PORT: 8085
      FLOWDESK_NOTIFICATION_DB_PASSWORD: ${FLOWDESK_NOTIFICATION_DB_PASSWORD:?set FLOWDESK_NOTIFICATION_DB_PASSWORD}
      FLOWDESK_NOTIFICATION_RECOVERY_DB_PASSWORD: ${FLOWDESK_NOTIFICATION_RECOVERY_DB_PASSWORD:?set FLOWDESK_NOTIFICATION_RECOVERY_DB_PASSWORD}
      FLOWDESK_CURSOR_TOKEN_HMAC_KEY: ${FLOWDESK_CURSOR_TOKEN_HMAC_KEY:?set FLOWDESK_CURSOR_TOKEN_HMAC_KEY}
      FLOWDESK_JWT_PUBLIC_KEY_FILE: /run/secrets/flowdesk-jwt-public.pem
      FLOWDESK_NOTIFICATION_ROCKETMQ_ACCESS_KEY: ${FLOWDESK_NOTIFICATION_ROCKETMQ_ACCESS_KEY:?set FLOWDESK_NOTIFICATION_ROCKETMQ_ACCESS_KEY}
      FLOWDESK_NOTIFICATION_ROCKETMQ_SECRET_KEY: ${FLOWDESK_NOTIFICATION_ROCKETMQ_SECRET_KEY:?set FLOWDESK_NOTIFICATION_ROCKETMQ_SECRET_KEY}
      FLOWDESK_ROCKETMQ_M8_ENABLED: "true"
    secrets:
      - source: flowdesk-jwt-public
        target: flowdesk-jwt-public.pem
    depends_on:
      seed-notification: {condition: service_completed_successfully}
      rocketmq-broker: {condition: service_healthy}
      rocketmq-topology-provision: {condition: service_completed_successfully}
      nacos-config-initialize: {condition: service_completed_successfully}
    networks: [data, control, messaging]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Correlation-Id: 00000000-0000-4000-8000-000000000000' http://127.0.0.1:8085/api/v1/internal/health/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  gateway:
    profiles: ["m10"]
    build:
      context: .
      dockerfile: Dockerfile
      args: {SERVICE: flowdesk-gateway}
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      <<: *nacos-client-environment
      FLOWDESK_GATEWAY_PORT: ${FLOWDESK_GATEWAY_PORT:-8080}
      FLOWDESK_JWT_PUBLIC_KEY_FILE: /run/secrets/flowdesk-jwt-public.pem
      # M10 is HTTPS-only at the published boundary.  Host-JVM profiles keep
      # their historical HTTP defaults in the generated local environment;
      # this profile must never silently downgrade to plaintext.
      FLOWDESK_GATEWAY_TLS_ENABLED: ${FLOWDESK_GATEWAY_TLS_ENABLED:-true}
      FLOWDESK_GATEWAY_TLS_KEY_STORE: ${FLOWDESK_GATEWAY_TLS_KEY_STORE:-/run/secrets/flowdesk-gateway-tls.p12}
      FLOWDESK_GATEWAY_TLS_KEY_STORE_PASSWORD: ${FLOWDESK_GATEWAY_TLS_KEY_STORE_PASSWORD:-}
      FLOWDESK_GATEWAY_TLS_KEY_STORE_TYPE: ${FLOWDESK_GATEWAY_TLS_KEY_STORE_TYPE:-PKCS12}
    secrets:
      - source: flowdesk-jwt-public
        target: flowdesk-jwt-public.pem
      - source: flowdesk-gateway-tls
        target: flowdesk-gateway-tls.p12
    depends_on:
      nacos-config-initialize: {condition: service_completed_successfully}
      iam: {condition: service_healthy}
      ticket: {condition: service_healthy}
      workflow: {condition: service_healthy}
      alert: {condition: service_healthy}
      notification: {condition: service_healthy}
    networks: [control, data, messaging, edge]
    ports:
      - "127.0.0.1:${FLOWDESK_GATEWAY_PORT:-8080}:${FLOWDESK_GATEWAY_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$$FLOWDESK_GATEWAY_TLS_ENABLED\" != \"true\" ]; then exit 1; fi; curl -k -fsS \"https://127.0.0.1:$${FLOWDESK_GATEWAY_PORT}/api/v1/internal/health/readiness\" >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  web:
    profiles: ["m10"]
    build:
      context: ./flowdesk-web
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    environment:
      FLOWDESK_GATEWAY_PORT: ${FLOWDESK_GATEWAY_PORT:-8080}
      FLOWDESK_GATEWAY_TLS_SERVER_NAME: ${FLOWDESK_GATEWAY_TLS_SERVER_NAME:-localhost}
    secrets:
      - source: flowdesk-gateway-ca
        target: flowdesk-gateway-ca.crt
    depends_on:
      gateway: {condition: service_healthy}
    networks: [edge]
    ports:
      - "127.0.0.1:${FLOWDESK_WEB_PORT:-8086}:8080"

networks:
  # Docker Desktop does not activate published host ports for `internal: true`
  # networks. The security boundary for local development is still enforced by
  # the explicit 127.0.0.1 host bindings above; no service binds 0.0.0.0.
  control:
  data:
  messaging:
  edge:

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  rocketmq-nameserver-logs:
  rocketmq-broker-store:
  rocketmq-broker-logs:
  flowdesk-service-tokens:

secrets:
  # The files are supplied by New-FlowDeskLocalEnv.ps1 or the M10 verifier and
  # are mounted read-only only into the services that need them.
  flowdesk-jwt-private:
    file: ${FLOWDESK_IAM_JWT_PRIVATE_KEY_FILE:?set FLOWDESK_IAM_JWT_PRIVATE_KEY_FILE}
  flowdesk-jwt-public:
    file: ${FLOWDESK_JWT_PUBLIC_KEY_FILE:?set FLOWDESK_JWT_PUBLIC_KEY_FILE}
  flowdesk-gateway-tls:
    file: ${FLOWDESK_GATEWAY_TLS_KEY_STORE_FILE:-./.data/milestone10/gateway-local.p12}
  flowdesk-gateway-ca:
    file: ${FLOWDESK_GATEWAY_TLS_CA_FILE:-./.data/keys/gateway.crt}
