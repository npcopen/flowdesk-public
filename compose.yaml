name: flowdesk-public

# Local dev/test stacks select one Spring environment per Compose project.
# Production uses the same application profiles with independently managed infrastructure.
x-nacos-client-environment: &nacos-client-environment
  SPRING_PROFILES_ACTIVE: ${FLOWDESK_ENVIRONMENT:-dev}
  FLOWDESK_NACOS_SERVER_ADDR: nacos:8848
  FLOWDESK_NACOS_GROUP: FLOWDESK_GROUP
  FLOWDESK_NACOS_USERNAME: ${FLOWDESK_NACOS_USERNAME:?set a non-admin FLOWDESK_NACOS_USERNAME}
  FLOWDESK_NACOS_PASSWORD: ${FLOWDESK_NACOS_PASSWORD:?set FLOWDESK_NACOS_PASSWORD}
  FLOWDESK_NACOS_DISCOVERY_ENABLED: "true"
  FLOWDESK_NACOS_REGISTER_ENABLED: "true"

x-flyway-common: &flyway-common
  image: flyway/flyway:11.14.1@sha256:ba032dc3fc4510694e1d096e2491ef562e42170ed91eec66ee5377b1124913d8
  restart: "no"
  networks:
    - data
  depends_on:
    mysql:
      condition: service_healthy
  command:
    - -connectRetries=30
    - -validateMigrationNaming=true
    - -cleanDisabled=true
    - migrate

x-flyway-demo-common: &flyway-demo-common
  image: flyway/flyway:11.14.1@sha256:ba032dc3fc4510694e1d096e2491ef562e42170ed91eec66ee5377b1124913d8
  restart: "no"
  networks:
    - data
  command:
    - -connectRetries=30
    - -validateMigrationNaming=true
    - -cleanDisabled=true
    - migrate

services:
  mysql:
    image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${FLOWDESK_MYSQL_ROOT_PASSWORD:?set FLOWDESK_MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      FLOWDESK_GATEWAY_DB_PASSWORD: ${FLOWDESK_GATEWAY_DB_PASSWORD:?set FLOWDESK_GATEWAY_DB_PASSWORD}
      FLOWDESK_IAM_DB_PASSWORD: ${FLOWDESK_IAM_DB_PASSWORD:?set FLOWDESK_IAM_DB_PASSWORD}
      FLOWDESK_IAM_MIGRATOR_PASSWORD: ${FLOWDESK_IAM_MIGRATOR_PASSWORD:?set FLOWDESK_IAM_MIGRATOR_PASSWORD}
      FLOWDESK_TICKET_DB_PASSWORD: ${FLOWDESK_TICKET_DB_PASSWORD:?set FLOWDESK_TICKET_DB_PASSWORD}
      FLOWDESK_TICKET_MIGRATOR_PASSWORD: ${FLOWDESK_TICKET_MIGRATOR_PASSWORD:?set FLOWDESK_TICKET_MIGRATOR_PASSWORD}
      FLOWDESK_WORKFLOW_DB_PASSWORD: ${FLOWDESK_WORKFLOW_DB_PASSWORD:?set FLOWDESK_WORKFLOW_DB_PASSWORD}
      FLOWDESK_WORKFLOW_MIGRATOR_PASSWORD: ${FLOWDESK_WORKFLOW_MIGRATOR_PASSWORD:?set FLOWDESK_WORKFLOW_MIGRATOR_PASSWORD}
      FLOWDESK_ALERT_DB_PASSWORD: ${FLOWDESK_ALERT_DB_PASSWORD:?set FLOWDESK_ALERT_DB_PASSWORD}
      FLOWDESK_ALERT_MIGRATOR_PASSWORD: ${FLOWDESK_ALERT_MIGRATOR_PASSWORD:?set FLOWDESK_ALERT_MIGRATOR_PASSWORD}
      FLOWDESK_NOTIFICATION_DB_PASSWORD: ${FLOWDESK_NOTIFICATION_DB_PASSWORD:?set FLOWDESK_NOTIFICATION_DB_PASSWORD}
      FLOWDESK_NOTIFICATION_MIGRATOR_PASSWORD: ${FLOWDESK_NOTIFICATION_MIGRATOR_PASSWORD:?set FLOWDESK_NOTIFICATION_MIGRATOR_PASSWORD}
      FLOWDESK_NOTIFICATION_RECOVERY_DB_PASSWORD: ${FLOWDESK_NOTIFICATION_RECOVERY_DB_PASSWORD:?set FLOWDESK_NOTIFICATION_RECOVERY_DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --explicit-defaults-for-timestamp=ON
      - --local-infile=OFF
      - --skip-name-resolve
      - --log-bin-trust-function-creators=ON
      # Local Compose has no replica or point-in-time-recovery consumer. Keep
      # InnoDB commit durability strict, but avoid a second per-transaction
      # Docker Desktop fsync for an otherwise unused local binary log.
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=0
      # The M7 webhook benchmark owns 64 independent fingerprint partitions.
      # Keep their hot indexes resident and avoid dedicated redo-writer handoff
      # overhead in this low-throughput local profile.
      - --innodb-buffer-pool-size=1G
      - --innodb-redo-log-capacity=512M
      - --innodb-log-writer-threads=OFF
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/bootstrap/00-bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
    networks:
      - data
    ports:
      # Loopback-only publishing for local development (host -> container). The
      # internal networks remain the primary path; nothing binds 0.0.0.0.
      # The host side is configurable because some machines already run a native
      # MySQL service on 3306 (for example MySQL80 on Windows).
      - "127.0.0.1:${FLOWDESK_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    environment:
      FLOWDESK_REDIS_PASSWORD: ${FLOWDESK_REDIS_PASSWORD:?set FLOWDESK_REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$FLOWDESK_REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    networks:
      - messaging
    ports:
      - "127.0.0.1:${FLOWDESK_REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$FLOWDESK_REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-verify:
    profiles: ["acceptance"]
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: "no"
    entrypoint: ["sh", "/verify/verify.sh"]
    environment:
      FLOWDESK_REDIS_PASSWORD: ${FLOWDESK_REDIS_PASSWORD:?set FLOWDESK_REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./infra/redis/verify.sh:/verify/verify.sh:ro
    networks:
      - messaging

  nacos:
    image: nacos/nacos-server:v3.1.2@sha256:65cf0ad9c84e45f0112cbef0acccb5541198b919f64d7e6ac61dd1f9d8c1509c
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_SYSTEM_TYPE: nacos
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_ADMIN_ENABLE: "true"
      NACOS_AUTH_CONSOLE_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${FLOWDESK_NACOS_AUTH_TOKEN:?set FLOWDESK_NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${FLOWDESK_NACOS_IDENTITY_KEY:?set FLOWDESK_NACOS_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${FLOWDESK_NACOS_IDENTITY_VALUE:?set FLOWDESK_NACOS_IDENTITY_VALUE}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - control
    ports:
      - "127.0.0.1:${FLOWDESK_NACOS_HTTP_PUBLISH_PORT:-8848}:8848"
      - "127.0.0.1:${FLOWDESK_NACOS_GRPC_PUBLISH_PORT:-9848}:9848"
      - "127.0.0.1:${FLOWDESK_NACOS_CONSOLE_PUBLISH_PORT:-28080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness | grep -q '\"data\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  nacos-initialize:
    image: nacos/nacos-server:v3.1.2@sha256:65cf0ad9c84e45f0112cbef0acccb5541198b919f64d7e6ac61dd1f9d8c1509c
    restart: "no"
    entrypoint: ["sh", "-ec"]
    environment:
      FLOWDESK_NACOS_ADMIN_PASSWORD: ${FLOWDESK_NACOS_ADMIN_PASSWORD:?set FLOWDESK_NACOS_ADMIN_PASSWORD}
    command:
      - |
        curl -sS -X POST http://nacos:8848/nacos/v3/auth/user/admin \
          --data-urlencode "password=$$FLOWDESK_NACOS_ADMIN_PASSWORD" >/dev/null || true
        curl -fsS -X POST http://nacos:8848/nacos/v3/auth/user/login \
          --data-urlencode "username=nacos" \
          --data-urlencode "password=$$FLOWDESK_NACOS_ADMIN_PASSWORD" | grep -q 'accessToken'
        echo FLOWDESK_NACOS_AUTH_LOGIN_OK
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - control

  nacos-config-initialize:
    profiles: ["m10"]
    image: python:3.12-alpine@sha256:b658b05ce9c4eb97ec6fc19424818a1f31993659c2b505a532f470e83807815d
    restart: "no"
    working_dir: /workspace
    entrypoint: ["sh", "-ec"]
    environment:
      FLOWDESK_ENVIRONMENT: ${FLOWDESK_ENVIRONMENT:-dev}
      FLOWDESK_NACOS_ADMIN_PASSWORD: ${FLOWDESK_NACOS_ADMIN_PASSWORD:?set FLOWDESK_NACOS_ADMIN_PASSWORD}
      FLOWDESK_NACOS_USERNAME: ${FLOWDESK_NACOS_USERNAME:?set a non-admin FLOWDESK_NACOS_USERNAME}
      FLOWDESK_NACOS_PASSWORD: ${FLOWDESK_NACOS_PASSWORD:?set FLOWDESK_NACOS_PASSWORD}
    command:
      - |
        case "$$FLOWDESK_ENVIRONMENT" in
          dev|test) ;;
          *) echo 'Local Compose supports dev/test only; deploy prod with isolated production infrastructure.' >&2; exit 1 ;;
        esac
        exec python scripts/nacos-config.py publish --environment "$$FLOWDESK_ENVIRONMENT" --server-addr http://nacos:8848 --provision-user
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./infra/nacos:/workspace/infra/nacos:ro
    depends_on:
      nacos-initialize: {condition: service_completed_successfully}
    networks: [control]

  rocketmq-nameserver:
    image: apache/rocketmq:5.3.4@sha256:d57ee4ebbd9d7bb6e185775bde41c128e98f185b25bf0b05c77d4e6c010572b8
    restart: unless-stopped
    command: ["sh", "mqnamesrv"]
    depends_on:
      rocketmq-volume-init:
        condition: service_completed_successfully
    volumes:
      - rocketmq-nameserver-logs:/home/rocketmq/logs
    networks:
      - messaging
    ports:
      - "127.0.0.1:${FLOWDESK_ROCKETMQ_NAMESERVER_PUBLISH_PORT:-9876}:9876"
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n 127.0.0.1:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  rocketmq-broker:
    image: apache/rocketmq:5.3.4@sha256:d57ee4ebbd9d7bb6e185775bde41c128e98f185b25bf0b05c77d4e6c010572b8
    restart: unless-stopped
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
      FLOWDESK_ROCKETMQ_BROKER_ADVERTISED_HOST: ${FLOWDESK_ROCKETMQ_BROKER_ADVERTISED_HOST:-127.0.0.1}
      FLOWDESK_ROCKETMQ_BROKER_VIP_PUBLISH_PORT: ${FLOWDESK_ROCKETMQ_BROKER_VIP_PUBLISH_PORT:-10909}
      FLOWDESK_ROCKETMQ_BROKER_PUBLISH_PORT: ${FLOWDESK_ROCKETMQ_BROKER_PUBLISH_PORT:-10911}
      FLOWDESK_ROCKETMQ_BROKER_HA_PUBLISH_PORT: ${FLOWDESK_ROCKETMQ_BROKER_HA_PUBLISH_PORT:-10912}
      FLOWDESK_ROCKETMQ_ACL_ENABLED: ${FLOWDESK_ROCKETMQ_ACL_ENABLED:-false}
      FLOWDESK_ROCKETMQ_ADMIN_ACCESS_KEY: ${FLOWDESK_ROCKETMQ_ADMIN_ACCESS_KEY:-}
      FLOWDESK_ROCKETMQ_ADMIN_SECRET_KEY: ${FLOWDESK_ROCKETMQ_ADMIN_SECRET_KEY:-}
      FLOWDESK_ROCKETMQ_INNER_ACCESS_KEY: ${FLOWDESK_ROCKETMQ_INNER_ACCESS_KEY:-}
      FLOWDESK_ROCKETMQ_INNER_SECRET_KEY: ${FLOWDESK_ROCKETMQ_INNER_SECRET_KEY:-}
    entrypoint: ["sh", "/flowdesk/start-broker.sh"]
    depends_on:
      rocketmq-nameserver:
        condition: service_healthy
      rocketmq-volume-init:
        condition: service_completed_successfully
    volumes:
      - ./infra/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.4/conf/flowdesk-broker.conf:ro
      - ./infra/rocketmq/start-broker.sh:/flowdesk/start-broker.sh:ro
      - rocketmq-broker-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    networks:
      - messaging
    ports:
      # Legacy host-JVM profiles receive a loopback Broker address from NameServer.
      # M10 sets the advertised host to rocketmq-broker and uses the internal
      # network; these optional bindings remain loopback-only.
      - "127.0.0.1:${FLOWDESK_ROCKETMQ_BROKER_VIP_PUBLISH_PORT:-10909}:${FLOWDESK_ROCKETMQ_BROKER_VIP_PUBLISH_PORT:-10909}"
      - "127.0.0.1:${FLOWDESK_ROCKETMQ_BROKER_PUBLISH_PORT:-10911}:${FLOWDESK_ROCKETMQ_BROKER_PUBLISH_PORT:-10911}"
      - "127.0.0.1:${FLOWDESK_ROCKETMQ_BROKER_HA_PUBLISH_PORT:-10912}:${FLOWDESK_ROCKETMQ_BROKER_HA_PUBLISH_PORT:-10912}"
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-nameserver:9876 2>/dev/null | grep -q flowdesk-broker"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  rocketmq-volume-init:
    image: apache/rocketmq:5.3.4@sha256:d57ee4ebbd9d7bb6e185775bde41c128e98f185b25bf0b05c77d4e6c010572b8
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - mkdir -p /nameserver-logs/rocketmqlogs /broker-logs/rocketmqlogs /broker-store && chown -R 3000:3000 /nameserver-logs /broker-logs /broker-store
    volumes:
      - rocketmq-nameserver-logs:/nameserver-logs
      - rocketmq-broker-store:/broker-store
      - rocketmq-broker-logs:/broker-logs
    networks:
      - messaging

  rocketmq-verify:
    profiles: ["acceptance"]
    image: apache/rocketmq:5.3.4@sha256:d57ee4ebbd9d7bb6e185775bde41c128e98f185b25bf0b05c77d4e6c010572b8
    restart: "no"
    entrypoint: ["sh", "/verify/verify.sh"]
    environment:
      FLOWDESK_ROCKETMQ_ACL_ENABLED: ${FLOWDESK_ROCKETMQ_ACL_ENABLED:-false}
      FLOWDESK_ROCKETMQ_ADMIN_ACCESS_KEY: ${FLOWDESK_ROCKETMQ_ADMIN_ACCESS_KEY:-}
      FLOWDESK_ROCKETMQ_ADMIN_SECRET_KEY: ${FLOWDESK_ROCKETMQ_ADMIN_SECRET_KEY:-}
      FLOWDESK_ROCKETMQ_VERIFY_BROKER_ADDRESS: ${FLOWDESK_ROCKETMQ_VERIFY_BROKER_ADDRESS:-}
      FLOWDESK_ROCKETMQ_VERIFY_BROKER_HOST: ${FLOWDESK_ROCKETMQ_VERIFY_BROKER_HOST:-127.0.0.1}
      FLOWDESK_ROCKETMQ_BROKER_VIP_PUBLISH_PORT: ${FLOWDESK_ROCKETMQ_BROKER_VIP_PUBLISH_PORT:-10909}
      FLOWDESK_ROCKETMQ_BROKER_PUBLISH_PORT: ${FLOWDESK_ROCKETMQ_BROKER_PUBLISH_PORT:-10911}
      FLOWDESK_ROCKETMQ_BROKER_HA_PUBLISH_PORT: ${FLOWDESK_ROCKETMQ_BROKER_HA_PUBLISH_PORT:-10912}
      FLOWDESK_ROCKETMQ_M7_ENABLED: ${FLOWDESK_ROCKETMQ_M7_ENABLED:-false}
      FLOWDESK_ROCKETMQ_M8_ENABLED: ${FLOWDESK_ROCKETMQ_M8_ENABLED:-false}
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    volumes:
      - ./infra/rocketmq/verify.sh:/verify/verify.sh:ro
    # NameServer advertises the loopback Broker address used by host JVMs. Sharing
    # the Broker network namespace lets the container verifier exercise that same
    # address without weakening the host-only publish bindings.
    network_mode: "service:rocketmq-broker"

  rocketmq-topology-provision:
    image: apache/rocketmq:5.3.4@sha256:d57ee4ebbd9d7bb6e185775bde41c128e98f185b25bf0b05c77d4e6c010572b8
    restart: "no"
    entrypoint: ["sh", "/provision/provision-topology.sh"]
    environment:
      FLOWDESK_ROCKETMQ_ACL_ENABLED: ${FLOWDESK_ROCKETMQ_ACL_ENABLED:-false}
      FLOWDESK_ROCKETMQ_ADMIN_ACCESS_KEY: ${FLOWDESK_ROCKETMQ_ADMIN_ACCESS_KEY:-}
      FLOWDESK_ROCKETMQ_ADMIN_SECRET_KEY: ${FLOWDESK_ROCKETMQ_ADMIN_SECRET_KEY:-}
      FLOWDESK_ROCKETMQ_ADMIN_BROKER_ADDRESS: ${FLOWDESK_ROCKETMQ_ADMIN_BROKER_ADDRESS:-}
      FLOWDESK_ROCKETMQ_ADMIN_BROKER_HOST: ${FLOWDESK_ROCKETMQ_ADMIN_BROKER_HOST:-127.0.0.1}
      FLOWDESK_ROCKETMQ_BROKER_PUBLISH_PORT: ${FLOWDESK_ROCKETMQ_BROKER_PUBLISH_PORT:-10911}
      FLOWDESK_ROCKETMQ_M7_ENABLED: ${FLOWDESK_ROCKETMQ_M7_ENABLED:-false}
      FLOWDESK_ROCKETMQ_M8_ENABLED: ${FLOWDESK_ROCKETMQ_M8_ENABLED:-false}
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    volumes:
      - ./infra/rocketmq/provision-topology.sh:/provision/provision-topology.sh:ro
    network_mode: "service:rocketmq-broker"

  rocketmq-acl-provision:
    image: apache/rocketmq:5.3.4@sha256:d57ee4ebbd9d7bb6e185775bde41c128e98f185b25bf0b05c77d4e6c010572b8
    restart: "no"
    entrypoint: ["sh", "/provision/provision-workflow-start-v1-acl.sh"]
    environment:
      FLOWDESK_ROCKETMQ_ACL_ENABLED: ${FLOWDESK_ROCKETMQ_ACL_ENABLED:-false}
      FLOWDESK_ROCKETMQ_ADMIN_ACCESS_KEY: ${FLOWDESK_ROCKETMQ_ADMIN_ACCESS_KEY:-}
      FLOWDESK_ROCKETMQ_ADMIN_SECRET_KEY: ${FLOWDESK_ROCKETMQ_ADMIN_SECRET_KEY:-}
      FLOWDESK_ROCKETMQ_ADMIN_BROKER_ADDRESS: ${FLOWDESK_ROCKETMQ_ADMIN_BROKER_ADDRESS:-}
      FLOWDESK_ROCKETMQ_ADMIN_BROKER_HOST: ${FLOWDESK_ROCKETMQ_ADMIN_BROKER_HOST:-127.0.0.1}
      FLOWDESK_ROCKETMQ_BROKER_PUBLISH_PORT: ${FLOWDESK_ROCKETMQ_BROKER_PUBLISH_PORT:-10911}
      FLOWDESK_TICKET_ROCKETMQ_ACCESS_KEY: ${FLOWDESK_TICKET_ROCKETMQ_ACCESS_KEY:-flowdeskticket}
      FLOWDESK_TICKET_ROCKETMQ_SECRET_KEY: ${FLOWDESK_TICKET_ROCKETMQ_SECRET_KEY:-}
      FLOWDESK_WORKFLOW_ROCKETMQ_ACCESS_KEY: ${FLOWDESK_WORKFLOW_ROCKETMQ_ACCESS_KEY:-flowdeskworkflow}
      FLOWDESK_WORKFLOW_ROCKETMQ_SECRET_KEY: ${FLOWDESK_WORKFLOW_ROCKETMQ_SECRET_KEY:-}
      FLOWDESK_ALERT_ROCKETMQ_ACCESS_KEY: ${FLOWDESK_ALERT_ROCKETMQ_ACCESS_KEY:-flowdeskalert}
      FLOWDESK_ALERT_ROCKETMQ_SECRET_KEY: ${FLOWDESK_ALERT_ROCKETMQ_SECRET_KEY:-}
      FLOWDESK_ROCKETMQ_M7_ENABLED: ${FLOWDESK_ROCKETMQ_M7_ENABLED:-false}
      FLOWDESK_NOTIFICATION_ROCKETMQ_ACCESS_KEY: ${FLOWDESK_NOTIFICATION_ROCKETMQ_ACCESS_KEY:-flowdesknotification}
      FLOWDESK_NOTIFICATION_ROCKETMQ_SECRET_KEY: ${FLOWDESK_NOTIFICATION_ROCKETMQ_SECRET_KEY:-}
      FLOWDESK_ROCKETMQ_M8_ENABLED: ${FLOWDESK_ROCKETMQ_M8_ENABLED:-false}
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    volumes:
      - ./infra/rocketmq/provision-workflow-start-v1-acl.sh:/provision/provision-workflow-start-v1-acl.sh:ro
    network_mode: "service:rocketmq-broker"

  migrate-iam:
    <<: *flyway-common
    entrypoint: ["bash", "/flyway/scripts/migrate-iam.sh"]
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/flowdesk_iam?sslMode=PREFERRED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      FLYWAY_USER: fd_iam_migrator
      FLYWAY_PASSWORD: ${FLOWDESK_IAM_MIGRATOR_PASSWORD:?set FLOWDESK_IAM_MIGRATOR_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./flowdesk-iam-service/src/main/resources/db/migration:/flyway/sql:ro
      - ./flowdesk-iam-service/src/main/resources/db/demo-migration:/flyway/demo:ro
      - ./infra/mysql/flyway/migrate-iam.sh:/flyway/scripts/migrate-iam.sh:ro

  migrate-ticket:
    <<: *flyway-common
    entrypoint: ["bash", "/flyway/scripts/migrate-ticket.sh"]
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/flowdesk_ticket?sslMode=PREFERRED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      FLYWAY_USER: fd_ticket_migrator
      FLYWAY_PASSWORD: ${FLOWDESK_TICKET_MIGRATOR_PASSWORD:?set FLOWDESK_TICKET_MIGRATOR_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./flowdesk-ticket-service/src/main/resources/db/migration:/flyway/sql:ro
      - ./flowdesk-ticket-service/src/main/resources/db/demo-migration:/flyway/demo:ro
      - ./infra/mysql/flyway/migrate-ticket.sh:/flyway/scripts/migrate-ticket.sh:ro

  migrate-workflow:
    <<: *flyway-common
    entrypoint: ["bash", "/flyway/scripts/migrate-workflow.sh"]
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/flowdesk_workflow?sslMode=PREFERRED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      FLYWAY_USER: fd_workflow_migrator
      FLYWAY_PASSWORD: ${FLOWDESK_WORKFLOW_MIGRATOR_PASSWORD:?set FLOWDESK_WORKFLOW_MIGRATOR_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
