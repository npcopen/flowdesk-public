server:
  port: ${FLOWDESK_GATEWAY_PORT:8080}
  ssl:
    enabled: ${FLOWDESK_GATEWAY_TLS_ENABLED:false}
    key-store: ${FLOWDESK_GATEWAY_TLS_KEY_STORE:}
    key-store-password: ${FLOWDESK_GATEWAY_TLS_KEY_STORE_PASSWORD:}
    key-store-type: ${FLOWDESK_GATEWAY_TLS_KEY_STORE_TYPE:PKCS12}

spring:
  application:
    name: flowdesk-gateway
  web:
    resources:
      # The independently deployed frontend owns all pages and static assets.
      # Disable defaults even if an old build left static files on the classpath.
      add-mappings: false
      # Boot's welcome-page mapping separately scans these locations for index.html.
      static-locations: []
  cloud:
    nacos:
      # No-profile local development and unit tests do not require remote config.
      # Managed dev/test/prod profiles explicitly enable required Nacos imports.
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        server-addr: ${FLOWDESK_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${FLOWDESK_NACOS_NAMESPACE:}
        group: ${FLOWDESK_NACOS_GROUP:DEFAULT_GROUP}
        username: ${FLOWDESK_NACOS_USERNAME:nacos}
        password: ${FLOWDESK_NACOS_PASSWORD:}
        enabled: ${FLOWDESK_NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${FLOWDESK_NACOS_REGISTER_ENABLED:true}

flowdesk:
  security:
    jwt:
      public-key-pem: ${FLOWDESK_JWT_PUBLIC_KEY_PEM:}
      public-key-location: ${FLOWDESK_JWT_PUBLIC_KEY_FILE:}
  gateway:
    webhook-require-tls: ${FLOWDESK_GATEWAY_WEBHOOK_REQUIRE_TLS:true}
    routes:
      iam: ${FLOWDESK_GATEWAY_ROUTES_IAM:lb://flowdesk-iam-service}
      ticket: ${FLOWDESK_GATEWAY_ROUTES_TICKET:lb://flowdesk-ticket-service}
      workflow: ${FLOWDESK_GATEWAY_ROUTES_WORKFLOW:lb://flowdesk-workflow-service}
      alert: ${FLOWDESK_GATEWAY_ROUTES_ALERT:lb://flowdesk-alert-service}
      notification: ${FLOWDESK_GATEWAY_ROUTES_NOTIFICATION:lb://flowdesk-notification-service}
